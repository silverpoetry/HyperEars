name: Signed build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build; empty uses the selected workflow ref
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: signed-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK without publishing a release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyperears-release.jks"
          chmod 600 "$RUNNER_TEMP/hyperears-release.jks"

      - name: Build release
        env:
          HYPEREARS_KEYSTORE_PATH: ${{ runner.temp }}/hyperears-release.jks
          HYPEREARS_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HYPEREARS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HYPEREARS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest
          :system-module:lintRelease
          :system-module:assembleRelease

      - name: Verify and prepare artifact
        id: artifact
        shell: bash
        run: |
          source_apk="system-module/build/outputs/apk/release/system-module-release.apk"
          test -f "$source_apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          verification="$($apksigner verify --verbose --print-certs "$source_apk")"
          printf '%s\n' "$verification"

          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' system-module/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          short_sha="$(git rev-parse --short=8 HEAD)"
          apk_name="HyperEars-v${version_name}-${short_sha}-signed.apk"
          artifact_name="HyperEars-v${version_name}-${short_sha}-signed"
          cp "$source_apk" "$apk_name"
          sha256sum "$apk_name" > "$apk_name.sha256"

          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          {
            echo "## Signed build"
            echo
            echo "- Source: \`$(git rev-parse HEAD)\`"
            echo "- Version: \`$version_name\`"
            echo "- APK: \`$apk_name\`"
            echo "- SHA-256: \`$(sha256sum "$apk_name" | cut -d' ' -f1)\`"
            echo "- Publication: Actions Artifact only; no tag or GitHub Release created"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: |
            ${{ steps.artifact.outputs.apk_name }}
            ${{ steps.artifact.outputs.apk_name }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
